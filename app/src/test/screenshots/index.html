<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sndmart — Compose UI preview</title>

body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e6e6e6;}
header{padding:24px 32px;border-bottom:1px solid #23262d;background:#11141a;position:sticky;top:0}
